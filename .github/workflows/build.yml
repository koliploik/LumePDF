name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish (Native AOT)
        run: >
          dotnet publish src/LumePDF/LumePDF.csproj
          -c Release
          -r win-${{ matrix.arch }}
          -p:Platform=${{ matrix.platform }}
          -o out/LumePDF

      - name: Package
        shell: pwsh
        run: |
          Remove-Item out/LumePDF/*.pdb -ErrorAction SilentlyContinue
          Copy-Item scripts/register.ps1 out/LumePDF/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md out/LumePDF/
          Compress-Archive -Path out/LumePDF -DestinationPath "LumePDF-win-${{ matrix.arch }}.zip"
          Get-ChildItem out/LumePDF | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: LumePDF-win-${{ matrix.arch }}
          path: LumePDF-win-${{ matrix.arch }}.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "LumePDF $GITHUB_REF_NAME" \
            --generate-notes
